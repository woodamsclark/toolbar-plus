<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root {
        --background-primary: #242424;
        --background-secondary: #1e1e1e;
        --background-modifier-border: #414141;
        --background-modifier-border-hover: #656565;
        --background-modifier-hover: #333;
        --text-normal: #ddd;
        --text-muted: #aaa;
        --text-faint: #777;
        --text-accent: #bc9ddd;
        --interactive-accent: #865da8;
        --text-on-accent: #fff;
        --font-interface: system-ui;
        --font-ui-small: 13px;
        --font-ui-medium: 15px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background-primary);
        color: var(--text-normal);
        font: 15px/1.5 system-ui;
      }
      main {
        max-width: 720px;
        margin: auto;
        padding: 40px 24px;
      }
      header {
        font-size: 12px;
        letter-spacing: 0.15em;
        color: #aaa;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia;
        font-weight: 400;
        font-size: 40px;
      }
      p {
        color: #aaa;
      }
      button {
        color: #ddd;
        background: #343434;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px;
        cursor: pointer;
      }
      nav {
        display: flex;
        gap: 8px;
      }
      #result {
        font-size: 12px;
        color: #bc9ddd;
      }
      .modal {
        position: fixed;
        z-index: 100;
        inset: 5vh 0;
        margin: auto;
        max-width: 620px;
        max-height: 90vh;
        overflow: auto;
        background: #242424;
        padding: 24px;
        border: 1px solid #444;
        border-radius: 16px;
        box-shadow: 0 0 0 100vmax #0008;
      }
      .modal-close-button {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 12px;
      }
      .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #383838;
      }
      .setting-item-info {
        flex: 1;
      }
      .setting-item-description {
        font-size: 12px;
        color: #999;
      }
      .setting-item-control {
        display: flex;
        gap: 8px;
      }
      .tp-command {
        font-size: 23px;
      }
      .tp-cell-icon {
        font-size: 23px;
      }
    </style>
  </head>
  <body class="mod-toolbar-open">
    <div class="mobile-toolbar" aria-hidden="true"></div>
    <main>
      <header>toolbar+ · development preview</header>
      <h1>A little grip.<br />Eight directions.</h1>
      <p>Your familiar editing tools, with a handle that goes where you do.</p>
      <nav>
        <button id="configure">Configure</button
        ><button id="float">Float</button><button id="dock">Dock</button>
      </nav>
      <p>
        Hold the nine dots to lift the handle. Once floating, swipe immediately
        to choose a command. Return to the center to cancel.
      </p>
      <p id="result" role="status">Ready to try.</p>
    </main>
    <script type="module" src="preview.js"></script>
  </body>
</html>
